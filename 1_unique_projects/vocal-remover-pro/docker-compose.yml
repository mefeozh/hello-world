services:
  vocal-remover:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vocal_remover_pro
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - LIBRARY_DIR=/app/library
      - MODEL_DIR=/app/models
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
    volumes:
      # Persistent output — all downloaded and processed audio
      - ./library:/app/library
      # UVR model files — mount from host, NOT baked into image (500MB+)
      # Point this to your local UVR models folder:
      # Windows example: C:/Users/YourName/AppData/Local/Programs/Ultimate Vocal Remover/models
      - ./models:/app/models
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G
        reservations:
          cpus: "1.0"
          memory: 2G
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
