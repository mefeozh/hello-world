<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ODTÜ-SAT İçerik Yönetimi</title>
    <style>
        /* Hide "Alt Gruplar" and "Üye Listesi" from the CMS sidebar */
        a[href="#/collections/subgroups"],
        a[href="#/collections/members"] {
            display: none !important;
        }
    </style>
</head>

<body>
    <!-- Include the script that builds the page and powers Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <!-- Custom members table link in sidebar -->
    <script>
        function injectMembersLink() {
            // Decap CMS renders a <nav> with an <ul> of collection links
            var nav = document.querySelector('nav ul');
            if (!nav || document.getElementById('cms-members-link')) return;
            var li = document.createElement('li');
            li.id = 'cms-members-link';
            li.innerHTML =
                '<a href="/admin/members.html" style="' +
                  'display:flex;align-items:center;gap:10px;' +
                  'padding:14px 16px;color:inherit;text-decoration:none;' +
                  'font-size:14px;font-weight:600;border-top:1px solid rgba(255,255,255,.1);' +
                  'background:rgba(255,255,255,.07);' +
                '">' +
                '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">' +
                  '<rect x="3" y="3" width="18" height="18" rx="2"/>' +
                  '<path d="M3 9h18M3 15h18M9 3v18"/>' +
                '</svg>' +
                'Üye Listesi' +
                '</a>';
            nav.appendChild(li);
        }

        new MutationObserver(injectMembersLink)
            .observe(document.documentElement, { childList: true, subtree: true });
    </script>


    <!-- Confirm before deleting a list item -->
    <script>
        function patchRemoveBtn(btn) {
            if (btn._confirmPatched) return;
            btn._confirmPatched = true;
            btn.addEventListener('click', function (e) {
                if (!window.confirm('Bu üyeyi silmek istediğinizden emin misiniz?')) {
                    e.stopImmediatePropagation();
                    e.preventDefault();
                }
            }, true /* capture — fires before React's synthetic events */);
        }

        new MutationObserver(function (mutations) {
            mutations.forEach(function (mutation) {
                mutation.addedNodes.forEach(function (node) {
                    if (node.nodeType !== 1) return;
                    if (node.matches('button[aria-label="Remove"]')) patchRemoveBtn(node);
                    node.querySelectorAll('button[aria-label="Remove"]').forEach(patchRemoveBtn);
                });
            });
        }).observe(document.documentElement, { childList: true, subtree: true });
    </script>

    <!-- Pre-save hook to limit auto-generated slug to 6 words -->
    <script>
        if (window.CMS) {
            CMS.registerEventListener({
                name: 'preSave',
                handler: function (data) {
                    var entry = data.entry;
                    if (entry.get('collection') === 'blog') {
                        
                        function generateSlug(str) {
                            if (!str) return '';
                            var trMap = {
                                'ç': 'c', 'ğ': 'g', 'ı': 'i', 'ö': 'o', 'ş': 's', 'ü': 'u', 'ə': 'e',
                                'Ç': 'c', 'Ğ': 'g', 'İ': 'i', 'Ö': 'o', 'Ş': 's', 'Ü': 'u', 'Ə': 'e'
                            };
                            var cleanStr = str.replace(/[çğıöşüÇĞİÖŞÜəƏ]/g, function(match) { return trMap[match]; });
                            
                            var slug = cleanStr.toLowerCase()
                                .replace(/[^a-z0-9]+/g, '-')
                                .replace(/^-+|-+$/g, '');
                                
                            var words = slug.split('-');
                            if (words.length > 6) {
                                slug = words.slice(0, 6).join('-');
                            }
                            return slug;
                        }

                        var entryData = entry.get('data');
                        var title = entryData.get('title');
                        var currentSlug = entryData.get('slug');
                        
                        if (!currentSlug && title) {
                            entryData = entryData.set('slug', generateSlug(title));
                            entry = entry.set('data', entryData);
                        }

                        // Generate slugs for other locales in i18n
                        var i18n = entry.get('i18n');
                        if (i18n && typeof i18n.keySeq === 'function') {
                            var locales = i18n.keySeq().toArray();
                            locales.forEach(function(locale) {
                                var localeData = i18n.getIn([locale, 'data']);
                                if (localeData) {
                                    var lTitle = localeData.get('title');
                                    var lSlug = localeData.get('slug');
                                    if (!lSlug && lTitle) {
                                        localeData = localeData.set('slug', generateSlug(lTitle));
                                        i18n = i18n.setIn([locale, 'data'], localeData);
                                    }
                                }
                            });
                            entry = entry.set('i18n', i18n);
                        }
                        
                        return entry; // Returning full entry allows updating i18n data
                    }
                    return entry.get('data');
                }
            });
        }
    </script>
</body>

</html>
