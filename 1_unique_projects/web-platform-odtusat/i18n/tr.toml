[project1_title]
other = "Posidonia Oceanica Yayılımı İnceleme Projesi"

[project1_desc]
other = "Bu proje, Akdeniz'e özgü Posidonia oceanica'nın yayılımını ve özelliklerini incelemeyi amaçlamaktadır. Türün varlığını belirlemek, değişiklikleri gözlemlemek ve halkın bilinçlendirilmesi yoluyla koruma sağlamak amaçları arasındadır."

[project2_title]
other = "Uluburun III 'ün oluşturduğu Balık Faunası Değerlendirmesi"

[project2_desc]
other = "Uluburun batığının replikası, Kaş-Hidayet Koyu'ndaki Sualtı Arkeopark projesi kapsamında ekolojik araştırmalar için kullanılmaktadır. Topluluğumuz ve SAD Ekoloji grubu, mevsimsel örneklemelerle batığın bölgedeki balık komuniteleri üzerindeki etkisini ve mevsimsel değişimleri incelemektedir."

[project3_title]
other = "\"Engelsiz ODTÜ Maviyle Buluşuyor\" Projesi"

[project3_desc]
other = "\"Dalışa Hiçbir Şey Engel Değildir, Ankara Bile…\" sloganıyla yola çıkan \"Engelsiz ODTÜ Maviyle Buluşuyor\" projesi, toplumdaki \"engelli olmak\" algısını yıkmak ve herkes için fırsat eşitliği sağlamaktı için Marmaris'de yapılmış bir projedir. Bu anlamlı proje, dalışın engel tanımadığını bir kez daha kanıtlayarak Yılın Etkinliği ödülüne layık görüldü."

