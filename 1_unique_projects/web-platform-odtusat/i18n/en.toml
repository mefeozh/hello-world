[project1_title]
other = "Posidonia Oceanica Distribution Research Project"

[project1_desc]
other = "This project aims to examine the distribution and characteristics of Posidonia oceanica, endemic to the Mediterranean. Determining the species' existence, observing changes, and ensuring protection through public awareness are among the goals."

[project2_title]
other = "Assessment of Fish Fauna created by Uluburun III"

[project2_desc]
other = "The replica of the Uluburun shipwreck is used for ecological research within the scope of the Underwater Archaeopark project in Kaş-Hidayet Bay. Our community and the SAD Ecology group investigate the effect of the wreck on the fish communities in the region and seasonal changes with seasonal samplings."

[project3_title]
other = "\"Barrier-Free METU Meets the Blue\" Project"

[project3_desc]
other = "Setting out with the slogan \"Nothing is an Obstacle to Diving, Not Even Ankara...\", the \"Barrier-Free METU Meets the Blue\" project was carried out in Marmaris to break the perception of \"being disabled\" in society and to provide equal opportunities for everyone. This meaningful project proved once again that diving knows no barriers and was deemed worthy of the Event of the Year award."

