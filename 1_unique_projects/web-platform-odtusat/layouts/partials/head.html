<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} – {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ i18n "site_description" }}{{ end }}">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1359B6">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:title"
        content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} – {{ .Site.Title }}{{ end }}">
    <meta property="og:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ i18n "site_description" }}{{ end }}">
    <meta property="og:image" content="{{ .Site.BaseURL }}assets/images/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:locale" content="{{ .Site.LanguageCode }}">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{{ .Permalink }}">
    <meta name="twitter:title"
        content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} – {{ .Site.Title }}{{ end }}">
    <meta name="twitter:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ i18n "site_description" }}{{ end }}">
    <meta name="twitter:image" content="{{ .Site.BaseURL }}assets/images/og-image.jpg">

    <!-- Canonical -->
    <link rel="canonical" href="{{ .Permalink }}">

    <!-- Sitemap -->
    <link rel="sitemap" type="application/xml" title="Sitemap" href="{{ "sitemap.xml" | absURL }}">

    <!-- Multilingual hreflang -->
    {{ if .IsTranslated }}
    {{ range .AllTranslations }}
    <link rel="alternate" hreflang="{{ .Language.Lang }}" href="{{ .Permalink }}">
    {{ end }}
    {{ range .AllTranslations }}
    {{ if eq .Language.Lang "tr" }}
    <link rel="alternate" hreflang="x-default" href="{{ .Permalink }}">
    {{ end }}
    {{ end }}
    {{ end }}

    <!-- Fonts & Styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    </noscript>

    <!-- Main CSS -->
    <link rel="stylesheet" href="{{ "css/style.css" | absURL }}">
    <link rel="icon" href="{{ "assets/images/logo.png" | absURL }}">
    <link rel="apple-touch-icon" href="{{ "assets/images/apple-touch-icon.png" | absURL }}">

    {{ block "head" . }}{{ end }}
</head>
