<script>
    document.querySelector('.mobile-menu-btn').addEventListener('click', function (e) {
        e.stopPropagation();
        document.querySelector('.main-nav').classList.toggle('active');
    });

    // Close menu when clicking outside
    document.addEventListener('click', function (e) {
        const nav = document.querySelector('.main-nav');
        const menuBtn = document.querySelector('.mobile-menu-btn');
        if (nav.classList.contains('active') && !nav.contains(e.target) && !menuBtn.contains(e.target)) {
            nav.classList.remove('active');
        }
    });

    // Read More Functionality
    function toggleReadMore(btn) {
        const desc = btn.previousElementSibling;
        desc.classList.toggle('expanded');

        if (desc.classList.contains('expanded')) {
            btn.textContent = '{{ i18n "show_less" }}';
        } else {
            btn.textContent = '{{ i18n "read_more" }}';
        }
    }
</script>
